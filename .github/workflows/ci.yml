name: CI

on:
  push:
    branches-ignore:
      - 'release/**'
  pull_request:
    branches-ignore:
      - 'release/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out the code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'yarn'

    - name: Install dependencies
      run: yarn install --frozen-lockfile

    - name: Run eslint
      run: yarn lint .

    - name: Run tests
      run: yarn test
